name: CD

on:
    release:
        types: [ published ]
    push:
        branches: [ main ]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    build:
        name: Build prod images
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: 'Login to GitHub Container Registry'
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{github.actor}}
                    password: ${{secrets.GITHUB_TOKEN}}

            -   name: Docker Meta
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: ghcr.io/yohang/rte-production-monitor/app
                    tags: |
                        type=ref,event=branch
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=raw,value=latest,enable=${{ github.event_name == 'release' }}

            - name: Build and Push
              uses: docker/bake-action@v7
              env:
                  EXTERNAL_USER_ID: 33
                  TAGS: "${{ steps.meta.outputs.version }}${{ github.event_name == 'release' && ',latest' || '' }}"
              with:
                  files: |
                      compose.yaml
                      docker-bake.hcl
                  targets: app
                  push: true
                  set: |
                      app.cache-from=type=gha,scope=app-main
                      app.cache-from=type=gha,scope=app-${{ github.ref_name }}
                      app.cache-to=type=gha,scope=app-${{ github.ref_name }},mode=max

    deploy-prod:
        name: Deploy to PROD
        runs-on: ubuntu-latest
        needs: [ build ]
        environment: PROD
        if: github.event_name == 'release'
        env:
            DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'
            APP_ENV: ${{ vars.APP_ENV }}
            APP_SECRET: ${{ secrets.APP_SECRET }}
            SERVER_NAME: ${{ secrets.SERVER_NAME }}
            APP_VERSION: ${{ github.ref_name }}
            EXTERNAL_USER_ID: 33
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Compose
                uses: docker/setup-compose-action@v2
                with:
                    version: latest
            -   name: Set up private key
                run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
            -   name: Connect to Tailscale
                uses: tailscale/github-action@v4
                with:
                    oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                    oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                    tags: tag:ci
            -   name: Trust remote host
                run: ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
            -   name: Docker login
                run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            -   name: Deploy to ${{ vars.TARGET_ENV }}
                run: docker compose -p rte-production-monitor -f compose.yaml up -d --pull always --wait app --force-recreate --no-build --remove-orphans || (docker compose logs && exit 1)
            -   name: Prune server
                run: docker system prune -f --all --volumes
